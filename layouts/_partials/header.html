{{- $home := relURL "" }}
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ $home }}"{{ if .IsHome }} aria-current="page"{{ end }}>
      {{- partial "mark.html" . -}}
      <span class="brand__name">Hydro<span>Impact</span></span>
    </a>
    <nav aria-label="Main">
      <ul class="nav">
        <li><a href="{{ $home }}#about">Project</a></li>
        <li><a href="{{ "news/" | relURL }}"{{ if eq .Section "news" }} aria-current="page"{{ end }}>News</a></li>
        {{- with site.GetPage "/papers" }}{{ with .RelPermalink }}
        <li><a href="{{ . }}"{{ if eq $.RelPermalink . }} aria-current="page"{{ end }}>Papers</a></li>
        {{- end }}{{ end }}
        <li><a class="nav__cta" href="{{ $home }}#updates">Get updates</a></li>
      </ul>
    </nav>
  </div>
</header>
